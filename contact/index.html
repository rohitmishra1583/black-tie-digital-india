  <style>
    .contact-section {
      padding: 100px 4%;
      background: radial-gradient(circle at top, var(--color-charcoal), var(--color-black) 70%);
      color: var(--color-white);

      animation: fadeSlideUp 1s ease;
    }

    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .contact-info h2 {
      font-size: 32px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, var(--color-gold-light), var(--color-white), var(--color-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .contact-info p {
      color: var(--color-gray);
      margin-bottom: 25px;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .info-item i {
      margin-right: 10px;
      color: var(--color-gold);
    }

    .info-item a {
      color: var(--color-gray-lighter);
      text-decoration: none;
      transition: 0.3s;
    }

    .info-item a:hover {
      text-decoration: underline;
      color: var(--color-white);
    }

    .contact-social a {
      margin-right: 10px;
      font-size: 16px;
      color: var(--color-surface-alt);
      transition: 0.3s;
    }

    .contact-social a:hover {
      color: var(--color-gold);
      transform: scale(1.2);
    }

    .contact-form {
      background: rgba(255, 255, 255, 0.04);
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    .input-box input,
    .input-box textarea {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      background: var(--color-black);
      color: var(--color-white);
      border-radius: 6px;
    }

    .input-box textarea {
      height: 100px;
      resize: none;
    }

    .input-box label {
      position: absolute;
      left: 12px;
      top: 12px;
      color: var(--color-gray);
      transition: 0.3s;
      pointer-events: none;
    }

    .input-box input:focus+label,
    .input-box input:valid+label,
    .input-box textarea:focus+label,
    .input-box textarea:valid+label {
      top: -8px;
      left: 8px;
      font-size: 12px;
      color: var(--color-gold);
      background: var(--color-black);
      padding: 0 5px;
    }

    .contact-form button {
      width: 100%;
      padding: 12px;
      border: none;
      background: linear-gradient(135deg, var(--color-gold), var(--color-gold-light));
      color: var(--color-true-black);
      cursor: pointer;
      border-radius: 6px;
      transition: 0.3s;
    }

    .contact-form button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    @media (max-width: 992px) {
      .contact-section {
        padding-top: 100px;
      }

      .contact-container {
        gap: 40px;
      }

      .contact-info h2 {
        font-size: 26px;
      }

      .contact-info p {
        font-size: 14px;
      }

      .contact-form {
        padding: 25px;
      }
    }

    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 576px) {
      .contact-section {
        padding-top: 100px;
      }

      .contact-container {
        padding-top: 20px;
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .contact-info {
        text-align: center;
      }

      .contact-info h2 {

      .input-box textarea {

        padding: 10px;

        font-size: 14px;

      <div class="contact-info">
        <h2>Let’s Build Something Amazing 🚀</h2>
        <p>
          Have a project in mind? We’d love to hear from you.
          Reach out and let’s grow your business digitally.
        </p>
        <div class="info-item">
          <i class="fas fa-phone"></i>
          <span><a href="tel:+918890099108">+91-88900 99108</a> |
            <a href="tel:+919131959986">+91-91319 59986</a></span>
        </div>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <span><a href="mailto:blacktiedigital@gmail.com">blacktiedigital@gmail.com</a></span>
        </div>
        <div class="info-item">
          <i class="fas fa-location-dot"></i>
          <span>Pune, Maharashtra</span>
        </div>
        <div class="contact-social">
          <a href="https://www.facebook.com/profile.php?id=61561695247589"><i class="fab fa-facebook-f"></i></a>
          <a href="https://www.instagram.com/itsblacktiedigital?igsh=MTlxczRkeGwwNHF6Yg=="><i
              class="fab fa-instagram"></i></a>
          <a href="https://www.linkedin.com/company/black-tie-digital-india/posts/?feedView=all"><i
              class="fab fa-linkedin-in"></i></a>
          <a href="https://www.youtube.com/@BlackTieDigitalIndia"><i class="fab fa-youtube"></i></a>

        </div>

      <div class="contact-form">
        <form id="contactForm">
          <div class="input-box">
            <input id="cf-name" required type="text" />
            <label>Full Name</label>
          </div>
          <div class="input-box">
            <input id="cf-email" required type="email" />
            <label>Email Address</label>
          </div>
          <div class="input-box">
            <input id="cf-subject" required type="text" />
            <label>Subject</label>
          </div>
          <div class="input-box textarea">
            <textarea id="cf-message" required></textarea>
            <label>Your Message</label>
          </div>
          <button type="submit">Let’s Build This 🚀</button>
        </form>
      </div>
    </div>
  </section>
  <div id="footer"></div>
  <div class="whatsapp-container">
    <a class="whatsapp-float" href="https://wa.me/918890099108" target="_blank">
      <img alt="WhatsApp" decoding="async" loading="lazy" src="/images/icons8-whatsapp-96.png" />
    </a>
    <span class="whatsapp-tooltip">Chat with us</span>
  </div>
  <div class="cursor-hand"></div>
  <script src="/js/script.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const form = document.getElementById("contactForm");
      const WHATSAPP_NUMBER = "918890099108";

      if (!form) {
        return;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("cf-name").value.trim();
        const email = document.getElementById("cf-email").value.trim();
        const subject = document.getElementById("cf-subject").value.trim();
        const message = document.getElementById("cf-message").value.trim();

        if (!name || !email || !subject || !message) {
          alert("Please fill in all fields before sending.");
          return;
        }

        const text =
          "Hello Black Tie Digital India, I'd like to get in touch.\n\n" +
          "Let's Build Something Amazing 🚀\n\n" +
          "Name: " + name + "\n" +
          "Email: " + email + "\n" +
          "Subject: " + subject + "\n" +
          "Message: " + message;

        const whatsappUrl =
          "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);

        window.open(whatsappUrl, "_blank");

        form.reset();
      });

    });
  </script>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });
  </script>
